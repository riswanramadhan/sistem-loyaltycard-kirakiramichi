<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Undangan admin Kira Kira Michi</title>
  </head>
  <body style="margin:0;background:#f4f3f1;font-family:Arial,sans-serif;color:#2b2728">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:28px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e5e0de;border-radius:24px;overflow:hidden">
          <tr><td style="height:8px;background:#ed2024"></td></tr>
          <tr><td style="padding:32px;text-align:center">
            <img src="https://kirakiraloyaltycard.web.id/kira-kira-michi-logo.png" width="164" alt="Kira Kira Michi">
            <h1 style="margin:24px 0 10px;font-size:26px">Undangan akun admin</h1>
            <p style="margin:0 0 24px;color:#686163;font-size:15px;line-height:1.7">Kamu diundang untuk mengelola loyalty Kira Kira Michi. Aktifkan akses melalui tombol aman berikut.</p>
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;border-radius:12px;background:#ed2024;color:#fff;font-weight:700;text-decoration:none">Aktifkan akun admin</a>
            <p style="margin:24px 0 0;color:#686163;font-size:13px;line-height:1.7">Tautan hanya berlaku untuk penerima email ini. Jika tidak mengenali undangan, abaikan email ini.</p>
          </td></tr>
          <tr><td style="padding:20px;background:#2b2728;color:#fff;font-size:12px;text-align:center">Kira Kira Michi &middot; kirakiraloyaltycard.web.id</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
